# docker-compose.yml - Complete RAG Agent Stack (All-in-One)
# Everything runs in Docker including Ollama LLM
# Mac Compatible - No GPU setup needed
version: '3.8'

services:
  # Chroma Vector Database
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: rag-chroma
    ports:
      - "8000:8000"
    environment:
      - CHROMA_ENVIRONMENT=server
      - PERSIST_DIRECTORY=/chroma/data
    volumes:
      - chroma_data:/chroma/data
    restart: unless-stopped
    healthcheck:
      disable: true

  # Next.js RAG Application
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      chroma:
        condition: service_started
      # ollama:
      #   condition: service_started
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  chroma_data:
    driver: local
  ollama_data:
    driver: local

networks:
  rag-network:
    driver: bridge